<!DOCTYPE html>
<htlml>
    <head>
        <tittle>My favourite food slider</tittle>
    </head>
    <body>
        <section>
            <img class="MySlides" src="Slider in website/chhole bhature.jpeg" style="height:250px">
            <img class="MySlides" src="Slider in website/rasmali.jpeg" style="height:250px">
        </section>
        <script>
       var myindex=0;
       carousel();
       function  carousel(){
        var i;
        var x=document.getElementsByClassName("MySlides");
        for(i=0; i<x.length; i++){
            x[i].style.display="none";
        }
        myindex++
        if(myindex>x.length){
            myindex=1
        }
        x[myindex-1].style.display="block";
        setTimeout(carousel,3000);
       }
        </script>
    </body>
</htlml>
